version: '3.9'

services:
  qa-bot:
    build: .
    image: qa-ai-agent:latest
    container_name: qa-bot
    restart: unless-stopped          # автоперезапуск при сбое или перезагрузке сервера

    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BOT_TOKEN=${BOT_TOKEN}
      - ALLOWED_USERS=${ALLOWED_USERS}
      - NODE_ENV=production
      - MYNDP_LOGIN=${MYNDP_LOGIN}
      - MYNDP_PASSWORD=${MYNDP_PASSWORD}

    volumes:
      # Персистентные данные — сохраняются между перезапусками контейнера
      - ./tests:/app/tests
      - ./reports:/app/reports
      - ./test-results:/app/test-results
      # Журнал заявок на выписку (НС и МСТ): после перезапуска бот сначала выясняет судьбу незавершённых
      - ./data/insurance-runs:/app/data/insurance-runs

    # Chromium требует эти флаги внутри Docker
    security_opt:
      - seccomp:unconfined
    shm_size: '256mb'                # предотвращает краш Chromium на больших страницах

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    healthcheck:
      test: ['CMD-SHELL', "pidof node || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
